# Local development overrides.
# Auto-loaded by `docker compose` (no -f needed), so the local:* mise tasks
# run plain `docker compose ...` and pick up base + this file.
services:
  node:
    container_name: ${APP_NAME}_node
    hostname: ${APP_NAME}_node
    tty: true
    ports:
      - 3000:3000
    volumes:
      - .:/app
    environment:
      - UID_HOST_USER=${UID_HOST_USER}
      - GID_HOST_USER=${GID_HOST_USER}
