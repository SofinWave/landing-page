# Base (shared) configuration for all environments.
# Environment-specific settings live in the override files:
#   docker-compose.override.yml  -> local dev (auto-loaded by `docker compose`)
#   docker-compose.prod.yml      -> production (applied explicitly by prod:* tasks)
networks:
  network_app:
    driver: bridge

services:
  node:
    restart: unless-stopped
    build:
      context: .
      dockerfile: .docker/development/node/Dockerfile
      args:
        - UID_HOST_USER=${UID_HOST_USER}
        - GID_HOST_USER=${GID_HOST_USER}
    networks:
      - network_app
