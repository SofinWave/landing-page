# Raspberry Pi (arm64) overrides.
# NOT auto-loaded — applied explicitly by the rpi:* mise tasks via
# `docker compose -f docker-compose.yml -f docker-compose.rpi.yml ...`,
# which deliberately excludes docker-compose.override.yml.
#
# Topology:  upstream proxy (Cloudflare Tunnel) -> caddy:8003 -> node:3000
# Only Caddy is published to the host; node is internal-only.
#
# Container names are static (APP_NAME is only a cosmetic naming var and is not
# read by the app). Optional runtime config lives in .env.rpi (gitignored;
# see .env.rpi.example) and is loaded by the rpi:* tasks when present.
services:
  node:
    container_name: sofinwave_rpi_node
    hostname: sofinwave_rpi_node
    build:
      dockerfile: .docker/rpi/node/Dockerfile
    env_file:
      - path: .env.rpi
        required: false
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: sofinwave_rpi_caddy
    hostname: sofinwave_rpi_caddy
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-8003}:80"
    volumes:
      - ./.docker/rpi/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - network_app

volumes:
  caddy_data:
  caddy_config:
